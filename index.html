:root {
  --bg: #f5f3f7; --surface: #ffffff; --ink: #1e1a25; --muted: #625b70; --line: #e2dde9;

@media (prefers-color-scheme: dark) {

    --accent: #e0566b; --accent-ink: #1a0a0e; --field: #221f29; color-scheme: dark; }
}
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; font-size: 15px; line-height: 1.7; }
#gate { max-width: 420px; margin: 12vh auto 0; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }

#gate p { margin: 0; color: var(--muted); }
#gate form { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
#gate label { font-weight: 700; }
#gate input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); }
#gate button { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
#gate button:disabled { opacity: .5; cursor: progress; }
#gate input:focus-visible, #gate button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#gate-msg { min-height: 1.6em; }
#gate-msg.bad { color: var(--accent); }
#forget-box { max-width: 1180px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 32px; text-align: right; font-size: .8rem; display: grid; gap: 6px; justify-items: end; }
#forget-msg { color: var(--accent); }

<noscript><p style="padding:16px">このページを開くには JavaScript を有効にしてください。</p></noscript>
<main id="gate" hidden>
  <h1>ALTER Skeb依頼文メーカー</h1>
  <p>ALTER PRODUCTION の社内用ページです。パスワードを入力してください。</p>
  <form id="gate-form" autocomplete="off">
    <label for="pw">パスワード</label>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" required>
    <button type="submit" id="gate-btn">開く</button>
  </form>
  <p>一度開くと、この端末のこのブラウザでは次回から自動で開きます。共用の端末では、開いた画面のいちばん下にある「この端末のログインを解除」を押してください。</p>
  <p id="gate-msg" role="status"></p>
</main>
<div id="app" hidden></div>
<script>
// 下の本体が動かない・途中で止まったときでも、4秒たって何も出ていなければパスワード画面を出す
setTimeout(function () {
  var g = document.getElementById("gate"), a = document.getElementById("app");
  if (g && g.hidden && a && a.hidden) g.hidden = false;
}, 4000);
</script>

<script>
(function () {
  "use strict";
  var enc = JSON.parse(document.getElementById("payload").textContent);
  var form = document.getElementById("gate-form");
  var msg = document.getElementById("gate-msg");
  var btn = document.getElementById("gate-btn");

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

  // パスワードから作った鍵（取り出せない CryptoKey）を IndexedDB に覚えておき、次回はそれで開く。
  // パスワードそのものは保存しない。同じ github.io のほかのページと名前がぶつからないよう、リポジトリ名を入れる
  var DB_NAME = "alter-skeb-request-maker:gate", STORE = "keys", KEY_ID = "unlock";
  function openDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function withStore(mode, fn) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var req;
        try {
          var tx = db.transaction(STORE, mode);
          req = fn(tx.objectStore(STORE));
          tx.oncomplete = function () { db.close(); resolve(req.result); };
          tx.onerror = function () { db.close(); reject(tx.error); };
          tx.onabort = function () { db.close(); reject(tx.error || new Error("abort")); };
        } catch (err) {
          db.close();
          reject(err);
        }
      });
    });
  }
  // IndexedDB が返事をしない環境（一部のプライベートモード）でも、少し待ったら次へ進む
  function withTimeout(p, ms) {
    return Promise.race([p, new Promise(function (_, reject) { setTimeout(function () { reject(new Error("timeout")); }, ms); })]);
  }
  function loadKey() { return withTimeout(withStore("readonly", function (s) { return s.get(KEY_ID); }), 2000); }
  function saveKey(key) { return withTimeout(withStore("readwrite", function (s) { return s.put({ salt: enc.salt, key: key }, KEY_ID); }), 2000); }
  function forgetKey() { return withTimeout(withStore("readwrite", function (s) { return s.delete(KEY_ID); }), 2000); }

  function deriveKey(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iterations, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    });
  }

  async function decryptWith(key) {
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
    var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }

  // 「この端末のログインを解除」。消せたときだけ開き直す（消せなかったのに解除したつもりにならないように）
  function forgetBox() {
    var box = document.createElement("div");
    box.id = "forget-box";
    var forget = document.createElement("button");
    forget.type = "button";
    forget.className = "ghost";
    forget.id = "forget";
    forget.textContent = "この端末のログインを解除";
    var note = document.createElement("span");
    note.id = "forget-msg";
    note.setAttribute("role", "status");
    forget.addEventListener("click", function () {
      forget.disabled = true;
      forgetKey().then(function () { location.reload(); }, function () {
        forget.disabled = false;
        note.textContent = "解除できませんでした。ブラウザの設定で、このサイトのデータを消してください。";
      });
    });
    box.appendChild(forget);
    box.appendChild(note);
    return box;
  }

  // 復号したツール本体（Artifact 用の書き方）をこのページに組み込む
  function mount(html) {
    var doc = new DOMParser().parseFromString("<!doctype html><html><head></head><body>" + html + "</body></html>", "text/html");
    var title = doc.querySelector("title");
    if (title) document.title = title.textContent;
    doc.querySelectorAll("link, style").forEach(function (n) { document.head.appendChild(document.importNode(n, true)); });
    var app = document.getElementById("app");
    var scripts = [];
    Array.prototype.slice.call(doc.body.childNodes).forEach(function (n) {
      var name = n.nodeName;
      if (name === "SCRIPT") { scripts.push(n.textContent); return; }
      if (name === "TITLE" || name === "META" || name === "LINK" || name === "STYLE") return;
      app.appendChild(document.importNode(n, true));
    });
    app.appendChild(forgetBox());
    document.getElementById("gate").remove();
    document.getElementById("payload").remove();
    app.hidden = false;
    scripts.forEach(function (code) { var s = document.createElement("script"); s.textContent = code; document.body.appendChild(s); });
  }

  function supported() { return !!(window.crypto && crypto.subtle && typeof DecompressionStream !== "undefined"); }

  function showGate(text) {
    var gate = document.getElementById("gate");
    if (!gate) return; // すでに開いた後
    gate.hidden = false;
    if (!supported()) {
      msg.className = "bad";
      msg.textContent = "このブラウザでは開けません。Chrome・Safari・Edge の新しい版で開いてください。";
    } else if (text) {
      msg.className = "bad";
      msg.textContent = text;
    }
    document.getElementById("pw").focus();
  }

  function tryMount(html) {
    try {
      mount(html);
      return true;
    } catch (err) {
      showGate("開けませんでした。ページを読み込み直してください。");
      return false;
    }
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    // 全角数字や前後の空白でも通るようにそろえる（組み立て側も前後の空白は外している）
    var pw = document.getElementById("pw").value.normalize("NFKC").trim();
    if (!pw || !supported()) return;
    btn.disabled = true;
    msg.className = "";
    msg.textContent = "確認しています…";
    var html;
    try {
      var key = await deriveKey(pw);
      html = await decryptWith(key);
      // 覚えられなくても（プライベートモード等）開くのは続ける
      await saveKey(key).catch(function () {});
    } catch (err) {
      msg.className = "bad";
      msg.textContent = "パスワードが違います。もう一度入力してください。";
      btn.disabled = false;
      document.getElementById("pw").select();
      return;
    }
    if (!tryMount(html)) btn.disabled = false;
  });

  // 開いたときに、覚えた鍵があればそれで開く。無い・古い（パスワードやソルトが変わった）ときは消してパスワード画面
  if (!supported() || !window.indexedDB) { showGate(); return; }
  loadKey().then(function (rec) {
    if (!rec) { showGate(); return; }
    if (rec.salt !== enc.salt || !rec.key) { return forgetKey().catch(function () {}).then(function () { showGate(); }); }
    return decryptWith(rec.key).then(tryMount, function () {
      return forgetKey().catch(function () {}).then(function () { showGate(); });
    });
  }).catch(function () { showGate(); });
})();
</script>
